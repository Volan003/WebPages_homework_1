<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"><!-- Кодировка страницы -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заголовок страницы</title><!-- Заголовок страницы -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Сайдбар -->
      <div class="col-md-3 col-12 bg-dark text-white min-vh-100 position-relative">
        <div class="p-3">
          <!-- Логотип и заголовок -->
          <div class="d-flex align-items-center mb-4">
            <img src="images/logo.svg"
                 alt="Логотип компании"
                 width="30"
                 height="30"
                 class="me-2"
                 onerror="this.onerror=null; this.src='images/fallback-logo.png';">
            <h4 class="m-0">Меню</h4>
          </div>

          <!-- Навигационное меню -->
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link text-white active" href="home.html" target="contentFrame">Главная</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="categories.html" target="contentFrame">Категории</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="orders.html" target="contentFrame">Заказы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="contacts.html" target="contentFrame">Контакты</a>
            </li>
          </ul>
        </div>

        <!-- Dropdown внизу контейнера -->
        <div class="position-absolute bottom-0 start-0 end-0 p-3">
          <div class="dropdown">
            <a class="btn btn-secondary dropdown-toggle w-100"
               role="button"
               data-bs-toggle="dropdown"
               aria-expanded="false">
              Пользователь
            </a>
            <ul class="dropdown-menu bg-dark">
              <li><a class="dropdown-item text-white" href="#">Профиль</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item text-white" href="#">Выход</a></li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Основной контент через iframe -->
      <div class="col-md-9 col-12">
        <iframe
          name="contentFrame"
          src="home.html"
          style="width: 100%; height: calc(100vh - 60px); border: none;">
        </iframe>
      </div>
    </div>
  </div>
</body>

</html>
